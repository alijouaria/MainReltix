<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reltix · Supplier</title>
  <link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/theme.css">
  <script src="/app.js" defer></script><script src="/flow.js" defer></script>
</head>
<body data-role="partner">
  <header class="topbar"><a class="brand" href="/" aria-label="Reltix home"><span class="brand-mark">r</span>reltix</a><span class="role-label">Energy supplier</span></header>
  <main class="main-area"><section class="panel panel-partner view active">
    <div class="panel-head"><h1 id="company-title">Supplier calls</h1><span class="muted small" id="order-id-label"></span></div>
    <p class="muted small" id="partner-lead"></p><div id="call-script" class="call-script"></div>
    <div id="partner-actions" class="answer-row"></div><div id="partner-issues"></div>
    <details class="fold"><summary>Prefilled order</summary><div id="order-card"></div></details>
    <details class="fold"><summary>Call history</summary><ol class="timeline" id="job-timeline"></ol></details>
  </section></main><footer class="app-footer">Reltix · Simulated supplier calls</footer>
</body>
</html>
